[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mindflight"
version = "0.0.1"
description = "GPU-parallel Crazyflie drone simulator + reinforcement learning, with a live 3D web viewer"
requires-python = ">=3.11"
# torch is not listed: install the CUDA build for your GPU yourself (see AGENTS.md).
dependencies = [
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]  # httpx: FastAPI TestClient
# Phase 2 · P4: fly a real Crazyflie (cflib) and run exported brains (ONNX). Pinned: the versions tested.
deploy = ["cflib==0.1.34", "onnx==1.23.2", "onnxruntime==1.26.0"]

[tool.setuptools.packages.find]
include = ["mindflight*"]

[tool.setuptools.package-data]
mindflight = ["drones/*.json", "viewer/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
