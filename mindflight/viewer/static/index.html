<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindFlight viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font-family: system-ui, sans-serif; }
    #hud {
      position: absolute; top: 10px; left: 10px; padding: 8px 12px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.55); color: #e6e6e6; font-size: 13px; line-height: 1.6;
      font-variant-numeric: tabular-nums; user-select: none;
    }
    #hud b { color: #fff; }
    .status-connected { color: #6fdc8c; }
    .status-connecting { color: #f1c21b; }
    .status-disconnected { color: #ff8389; }
    #legend { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.15); }
    .legend-row { display: flex; align-items: baseline; gap: 6px; }
    .legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .legend-expect { color: #9aa4b2; }
    #reset-row button {
      font: inherit; color: #e6e6e6; background: rgba(255, 255, 255, 0.12); cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; padding: 1px 8px;
    }
    #reset-row button:hover { background: rgba(255, 255, 255, 0.22); }
    #info { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.15); max-width: 460px; }
    #info[hidden], #charts[hidden], #board[hidden] { display: none; }
    .panel {
      position: absolute; padding: 8px 12px; border-radius: 6px; background: rgba(0, 0, 0, 0.55);
      color: #e6e6e6; font-size: 12px; font-variant-numeric: tabular-nums; user-select: none;
    }
    #charts { right: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
    .chart-label { color: #c8d0da; margin-bottom: 2px; }
    .chart canvas { display: block; background: rgba(255, 255, 255, 0.04); border-radius: 3px; }
    #board { right: 10px; top: 10px; font-size: 13px; }
    .board-title { font-weight: 600; margin-bottom: 4px; }
    #board th, #board td { padding: 1px 8px; text-align: right; }
    #board th:first-child, #board td:first-child { text-align: left; }

    /* The hub's sidebar (python -m mindflight.hub). Hidden unless the server sends "hub" messages. */
    #hub {
      position: absolute; top: 0; left: 0; bottom: 0; width: 300px; box-sizing: border-box; overflow-y: auto;
      padding: 14px 12px 20px; background: rgba(12, 16, 22, 0.92); border-right: 1px solid rgba(255, 255, 255, 0.08);
      color: #e6e6e6; font-size: 13px; display: flex; flex-direction: column; gap: 12px;
    }
    #hub[hidden], #hub-open[hidden] { display: none; }
    body.hub-open #hud { left: 310px; }
    .hub-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
    .hub-title { font-size: 17px; font-weight: 650; letter-spacing: 0.01em; }
    .hub-title span { color: #6fdc8c; }
    .hub-keys { color: #7d8794; font-size: 11px; line-height: 1.5; }
    .hub-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
    .hub-row .label { color: #9aa4b2; margin-right: 4px; }
    .hub-chip {
      font: inherit; font-size: 12px; color: #c8d0da; background: rgba(255, 255, 255, 0.06); cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.14); border-radius: 4px; padding: 2px 8px;
    }
    .hub-chip:hover { background: rgba(255, 255, 255, 0.14); }
    .hub-chip.on { color: #10141a; background: #6fdc8c; border-color: #6fdc8c; }
    .hub-group { display: flex; flex-direction: column; gap: 4px; }
    .hub-group-name {
      color: #7d8794; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; margin: 2px 0 2px 2px;
    }
    .hub-show {
      font: inherit; text-align: left; color: inherit; cursor: pointer; display: flex; flex-direction: column; gap: 2px;
      background: rgba(255, 255, 255, 0.035); border: 1px solid rgba(255, 255, 255, 0.07);
      border-left: 3px solid transparent; border-radius: 5px; padding: 7px 9px;
    }
    .hub-show:hover { background: rgba(255, 255, 255, 0.08); }
    .hub-show.current {
      background: rgba(111, 220, 140, 0.1); border-color: rgba(111, 220, 140, 0.35); border-left-color: #6fdc8c;
    }
    .hub-show.loading { border-left-color: #f1c21b; }
    .hub-show-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
    .hub-show-title { font-weight: 600; color: #fff; flex: none; }
    .hub-show-score {
      color: #6fdc8c; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; min-width: 0;
    }
    .hub-show-blurb { color: #9aa4b2; font-size: 12px; line-height: 1.4; }
    .hub-show.loading .hub-show-score::before { content: "loading… "; color: #f1c21b; }
    #hub-shows { display: flex; flex-direction: column; gap: 12px; }
    #hub-error { color: #ff8389; font-size: 12px; }
    #hub-error:empty { display: none; }
    #hub-open {
      position: absolute; top: 10px; left: 10px; font: inherit; font-size: 13px; color: #e6e6e6; cursor: pointer;
      background: rgba(0, 0, 0, 0.55); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 6px; padding: 6px 10px;
    }
    body.hub-closed #hud { top: 48px; }
    @media (max-width: 700px) { #hub { width: 100%; } }
  </style>
  <!-- Three.js from a pinned CDN version. No npm, no build step. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div>drones <b id="hud-drones">0</b></div>
    <div>render <b id="hud-render-fps">0</b> fps · stream <b id="hud-stream-fps">0</b> frames/s</div>
    <div>server <b id="hud-status" class="status-connecting">connecting</b></div>
    <label><input type="checkbox" id="size-toggle"> size ×10</label>
    <!-- Filled in from /config when the server sends drone groups (python -m mindflight.demo). -->
    <div id="legend" hidden></div>
    <div id="info" hidden></div>
    <div id="reset-row" hidden><button id="reset-button" type="button">restart (R)</button> <span id="loop-note"></span></div>
  </div>
  <nav id="hub" hidden>
    <div class="hub-head">
      <div class="hub-title">Mind<span>Flight</span> Hub</div>
      <button class="hub-chip" id="hub-hide" type="button" title="hide (H)">hide</button>
    </div>
    <div class="hub-keys">Click a show to switch. ↑ ↓ next / previous · R restart · H hide<br>Drag to orbit, scroll to zoom.</div>
    <div class="hub-row" id="hub-speed"></div>
    <div id="hub-error"></div>
    <div id="hub-shows"></div>
  </nav>
  <button id="hub-open" type="button" hidden>☰ shows (H)</button>
  <div id="charts" class="panel" hidden></div>
  <div id="board" class="panel" hidden></div>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
