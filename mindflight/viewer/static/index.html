<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MindFlight viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #10141a; font-family: system-ui, sans-serif; }
    #hud {
      position: absolute; top: 10px; left: 10px; padding: 8px 12px; border-radius: 6px;
      background: rgba(0, 0, 0, 0.55); color: #e6e6e6; font-size: 13px; line-height: 1.6;
      font-variant-numeric: tabular-nums; user-select: none;
    }
    #hud b { color: #fff; }
    .status-connected { color: #6fdc8c; }
    .status-connecting { color: #f1c21b; }
    .status-disconnected { color: #ff8389; }
    #legend { margin-top: 6px; padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.15); }
    .legend-row { display: flex; align-items: baseline; gap: 6px; }
    .legend-swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; flex: none; }
    .legend-expect { color: #9aa4b2; }
    #reset-row button {
      font: inherit; color: #e6e6e6; background: rgba(255, 255, 255, 0.12); cursor: pointer;
      border: 1px solid rgba(255, 255, 255, 0.25); border-radius: 4px; padding: 1px 8px;
    }
    #reset-row button:hover { background: rgba(255, 255, 255, 0.22); }
  </style>
  <!-- Three.js from a pinned CDN version. No npm, no build step. -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <div id="hud">
    <div>drones <b id="hud-drones">0</b></div>
    <div>render <b id="hud-render-fps">0</b> fps · stream <b id="hud-stream-fps">0</b> frames/s</div>
    <div>server <b id="hud-status" class="status-connecting">connecting</b></div>
    <label><input type="checkbox" id="size-toggle"> size ×10</label>
    <!-- Filled in from /config when the server sends drone groups (python -m mindflight.demo). -->
    <div id="legend" hidden></div>
    <div id="reset-row" hidden><button id="reset-button" type="button">restart (R)</button> <span id="loop-note"></span></div>
  </div>
  <script type="module" src="/static/main.js"></script>
</body>
</html>
